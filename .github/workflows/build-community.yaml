name: Build Community Images

# The image only ever contains apps/web, apps/collab and apps/api (see
# Dockerfile). A README edit or a CLI-only change cannot alter the image, so it
# does not need one. Deliberately a deny-list rather than an allow-list:
# anything new at the repo root still triggers a build. The list is spelled out
# twice because GitHub Actions does not support YAML anchors — keep both copies
# in sync.
# Publicação (push na main ou workflow_dispatch) SÓ ocorre se a versão do app
# (apps/web/package.json) subiu em relação à maior tag de versão (X.Y.Z ou vX.Y.Z;
# tags cli-*/core-* ignoradas). Lógica em .github/scripts/versao.mjs. Ao fim, o
# job `tag` cria vX.Y.Z no commit publicado. A tag vX.Y.Z não casa com o filtro
# '[0-9]*' do release.yaml (glob começa por dígito) e, criada com GITHUB_TOKEN,
# não dispara workflows. PRs seguem só construindo, sem publicar.
# Canais (regras em .github/scripts/deploy.sh): producao só publica a ponta da main; desenvolvimento só a ponta da
# dev. Ref livre falha, e a tag móvel da imagem (main ou dev) vem do ambiente, não da ref.
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente de destino
        type: choice
        options: [producao, desenvolvimento]
        default: producao
      ref:
        description: Branch a publicar (main para producao, dev para desenvolvimento)
        type: string
        default: main
      forcar:
        description: Ignorar a comparação de versão (republicar)
        type: boolean
        default: false
  # A imagem da comunidade é publicada SOMENTE em push para main. PRs contra
  # main ainda constroem para validação (sem publicar — ver push=... abaixo).
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'apps/cli/**'
      - 'apps/e2e/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'apps/cli/**'
      - 'apps/e2e/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'

permissions:
  contents: read
  packages: write

# One live run per PR (a PR build only validates, never publishes). Publishing runs queue per channel and are NEVER
# cancelled: the group does not depend on the ref (push to main and a dispatch from another branch share the
# "producao" queue), and it covers the decision (job versao), build, manifest and tag — the decision only holds
# if the previous run's tag already exists.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.event.pull_request.number) || format('publicar-{0}', inputs.ambiente || 'producao') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: learnhouse/app

jobs:
  versao:
    name: Verificar versão
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publicar: ${{ steps.v.outputs.publicar }}
      criar_tag: ${{ steps.v.outputs.criar_tag }}
      versao: ${{ steps.v.outputs.versao }}
      sha: ${{ steps.sha.outputs.sha }}
      branch: ${{ steps.canal.outputs.branch }}
      forcar: ${{ inputs.forcar == true && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Antes de qualquer decisão: o ambiente só aceita a ref do seu branch (push = producao, na main).
      - name: Validar ambiente e ref
        id: canal
        env:
          AMBIENTE: ${{ inputs.ambiente || 'producao' }}
          REF: ${{ inputs.ref || github.ref_name }}
        run: bash .github/scripts/deploy.sh validar

      - name: Buscar tags e resolver commit
        id: sha
        run: |
          git fetch --tags --force --quiet origin
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comparar versão com a última tag
        id: v
        env:
          FORCAR: ${{ inputs.forcar == true && 'true' || 'false' }}
          BRANCH: ${{ steps.canal.outputs.branch }}
          SHA: ${{ steps.sha.outputs.sha }}
        # bash --noprofile --norc -eo pipefail: o mesmo modo em que os testes de .github/scripts rodam o versao.mjs
        shell: bash
        run: |
          # Decisão dentro da fila: lê as tags do remoto (git ls-remote), recusa se o SHA não é a ponta atual da
          # branch do ambiente (push e dispatch) ou se a tag da versão já existe em outro SHA. Erro do git não vira
          # "sem tag": o passo falha.
          ARGS=(--arquivo apps/web/package.json --aceitar-sem-v --github-output --remoto origin --sha "$SHA" --branch "$BRANCH")
          if [ "$FORCAR" = "true" ]; then ARGS+=(--forcar); fi
          node .github/scripts/versao.mjs "${ARGS[@]}" > saida.txt
          cat saida.txt
          motivo=$(sed -n 's/^motivo=//p' saida.txt)
          if [ "$(sed -n 's/^publicar=//p' saida.txt)" = "true" ]; then
            echo "### Publicar: $motivo" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### $motivo" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: versao
    # PR: constrói para validar (sem publicar). push/dispatch: só se a versão subiu.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.versao.outputs.publicar == 'true') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versao.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare platform pair
        id: prep
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "platform_pair=$(echo "$PLATFORM" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            LEARNHOUSE_PUBLIC=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.versao.outputs.sha || github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha,scope=${{ steps.prep.outputs.platform_pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.prep.outputs.platform_pair }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TEMP_DIR: ${{ runner.temp }}
        run: |
          mkdir -p "$TEMP_DIR/digests"
          touch "$TEMP_DIR/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.prep.outputs.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create multi-platform manifest
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [versao, build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        env:
          SHA: ${{ needs.versao.outputs.sha }}
          # Vem do ambiente validado (main ou dev), nunca da ref de quem disparou.
          BRANCH: ${{ needs.versao.outputs.branch }}
        run: |
          SHA_SHORT=$(echo "$SHA" | cut -c1-7)

          TAGS="${REGISTRY}/${IMAGE_NAME}:${BRANCH}-${SHA_SHORT}"
          TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${BRANCH}"

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          TAGS=$(echo "$META_TAGS" | tr ',' '\n' | xargs -I{} echo "-t {}" | tr '\n' ' ')
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $TAGS \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)

  tag:
    name: Criar tag de versão
    needs: [versao, merge]
    # Tag só para produção (ambiente desenvolvimento não marca versão).
    if: needs.versao.outputs.criar_tag == 'true' && (inputs.ambiente || 'producao') == 'producao'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Criar tag v${{ needs.versao.outputs.versao }} no commit publicado
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ needs.versao.outputs.versao }}
          SHA: ${{ needs.versao.outputs.sha }}
          FORCAR: ${{ needs.versao.outputs.forcar }}
        shell: bash
        run: |
          set -euo pipefail
          # Tag existente (vX.Y.Z ou X.Y.Z): a imagem publicada é imutável e a tag tem de apontar para o commit
          # publicado. Só a publicação forçada mantém a tag onde está; sem forçar, outro SHA falha o job.
          for nome in "v${VERSAO}" "${VERSAO}"; do
            if existente=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${nome}" --jq .object.sha 2>/dev/null); then
              if [ "$existente" != "$SHA" ] && [ "$FORCAR" != true ]; then
                echo "::error::A tag ${nome} já existe em ${existente}, não em ${SHA} (a imagem publicada diverge da tag)."
                exit 1
              fi
              echo "::warning::Tag ${nome} já existe; mantida."
              echo "Tag ${nome} já existia; mantida." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/v${VERSAO}" -f sha="${SHA}" >/dev/null
          echo "Tag v${VERSAO} criada em ${SHA}." >> "$GITHUB_STEP_SUMMARY"
